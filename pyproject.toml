[project]
name = "job-triage"
version = "0.1.0"
description = "Pull IT job postings, kill the noise mechanically, and have Claude score what is left, bluntly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "powblubat", email = "73977384+powblubat@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
  "python-jobspy>=1.1.80",
  "requests>=2.31",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
screener = "screener.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener"]
