[location]
# Which places are kept is set per location in searches.toml (each [[locations]]
# block's `match` list), so a place you search is never a place this file kills.
# `screener locations add` keeps the two in step.

keep_remote_us = true

# Tokens that mean a "remote" posting isn't a US role after all.
foreign_markers = [
  "canada", "united kingdom", "india", "philippines", "mexico",
  "germany", "ireland", "australia", "poland", "brazil",
]

# The flag on jobs from a `market = "secondary"` location: kept, tagged, and
# held out of the default review queue.
secondary_tag = "secondary-market"

[flags.salary]
low_pay_below = 65000

[flags.contract]
# JobSpy's own job_type values that mean contract work.
job_types = ["contract", "temporary"]

[[flags.keyword]]
flag = "shift-risk"
keywords = [
  "rotating shift", "overnight", "night shift", "12-hour",
  "on-call rotation", "swing shift", "graveyard shift",
]

[[flags.keyword]]
flag = "contract"
keywords = [
  "contract-to-hire", "contract to hire", "c2h",
  "corp-to-corp", "w2 contract", "1099",
]

[remote]
# LinkedIn and Indeed both call a job remote if the word "remote" appears anywhere
# in it, so "provide onsite and remote support" is enough to get the tag. These
# lists decide whether a remote-tagged job really is remote. First match wins:
#   contradicted_by -> not remote, even if it also says remote somewhere
#   stated_by, or "remote" in the title or location -> remote
#   loosely_stated_by -> remote (the safe direction: you read it and toss it)
#   no mention of remote at all -> remote (the board's own listing data said so)
#   anything else -> not remote
# A job that isn't really remote goes through the normal location rule: kept in
# one of your locations, killed as "location:not-remote" anywhere else.
#
# Matching ignores case, markdown and hyphens, so "on site" also catches "On-Site".
# After editing, `screener refilter --dry-run` shows what the change would do.

contradicted_by = [
  # the arrangement stated outright
  "onsite position", "on site position", "onsite role", "on site role",
  "onsite opportunity", "on site opportunity", "onsite job", "on site job",
  "fully onsite", "fully on site", "100% onsite", "100% on site",
  "full time onsite", "full time on site", "100% work from office",
  "must be onsite", "must be on site", "required to be onsite", "required to be on site",
  "ability to work onsite", "ability to work on site",
  "work onsite at", "work on site at", "working onsite at", "report to the office",
  "in office position", "in office role", "in office requirement",
  # days in the office
  "days onsite", "days on site", "days in office", "days in the office",
  "a week onsite", "a week on site", "a week in the office", "per week in the office",
  "days per week onsite", "days per week on site",
  "work remotely one day", "work remotely two days", "work remotely 1", "work remotely 2",
  # hybrid
  "hybrid role", "hybrid position", "hybrid schedule", "hybrid work schedule",
  "hybrid opportunity", "hybrid arrangement", "hybrid work model",
  # said plainly
  "not a remote", "not remote", "no remote", "not eligible for remote", "remote work is not",
  # LinkedIn's #LI- workplace tags and Indeed's "Work Location:" line
  "li onsite", "li hybrid",
  "work location: in person", "work location: hybrid", "work location: on the road",
  # a remote day as a perk means the rest are in the office
  "remote workday", "remote work day", "remote day per week", "remote days per week",
  # the job is a site's own IT person, whatever the listing's location says
  "primary onsite", "primary on site",
]

# Checked against the title alone. Kept short: in a description these words turn
# up in duty lists ("assist with onsite projects"), in a title they don't.
title_contradicted_by = ["onsite", "on site", "hybrid", "in office"]

stated_by = [
  "fully remote", "100% remote", "remote position", "remote role", "remote job",
  "remote opportunity", "this role is remote", "position is remote", "job is remote",
  "work from home", "work from anywhere", "remote first", "remote based", "home based",
  "telecommute", "work remotely from", "remote in the us", "remote within the us",
  "remote, us", "remote (us", "work location: remote", "location: remote", "li remote",
]

loosely_stated_by = [
  "remote eligible", "may be remote", "remote, hybrid", "remote or hybrid", "remote/hybrid",
]

# A stated_by or loosely_stated_by phrase doesn't count when one of these sits
# within `negation_window` characters before it: "this role can not be done
# fully remote". Kept shorter and tighter than the kill keywords' negation on
# purpose. There, a false negation keeps a job you'd toss. Here, it kills a
# remote job you wanted, so a loose cue like "no" ("No commute! Fully remote.")
# stays off this list.
negated_by = ["not", "cannot", "can't", "never", "isn't", "aren't", "won't"]
negation_window = 25
