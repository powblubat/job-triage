# Hard filter rules. Edit this file, not Python — it is re-read on every run.
#
# Nothing here calls the API. This is the cost-control pass: most rows die here,
# which also means a bad rule shows up as a job you never saw rather than as an
# error. Change something, then run `screener stats` to see what it did.

[companies]
# Matched case-insensitively against the company field on word boundaries, so
# "Booz Allen" catches "Booz Allen Hamilton" while "Jacobs" won't catch "Jacobsen".
blocklist = [
  "Planet Fitness",    # their "Service Desk" is the front counter
]

[keywords]
# One unnegated match anywhere in title or description kills the row. The
# clearance keywords live in [govcon] below, so they can be switched off as a group.
kill = []

# Matched against the title only, no negation window. These are the roles that
# aren't yours: senior, lead and management titles, and the developer/architect/
# engineering specialties the wider Indeed searches drag in. Bare "engineer" is
# deliberately absent: "Application Support Engineer" is a help desk job.
# Remove "senior" and "sr" if you'd rather see those and toss them yourself.
title_kill = [
  "developer", "software engineer", "architect", "devops",
  "cloud engineer", "network engineer", "security engineer", "data engineer",
  "cyber", "servicenow", "consultant", "ai engineer", "platform engineer",
  "business analyst", "exploitation",
  "senior", "sr", "lead", "principal", "manager", "director",
  "intern", "internship", "recruiter", "sales", "driver",
]

# A match is ignored when one of these appears within `window_chars` BEFORE it.
# Without this, "no security clearance required" — which is exactly the posting
# you want — gets killed by the same rule that kills the GovCon reposts.
negation_before = [
  "no", "not", "non", "without", "never", "lack of",
  "don't", "doesn't", "does not", "isn't", "is not", "aren't", "are not",
  # "ability to obtain a Public Trust" means the employer will sponsor one you
  # don't hold yet, so the posting is open to you. Delete these four lines if you
  # decide you'd rather never see sponsor-to-obtain roles at all.
  "ability to obtain", "able to obtain", "eligible to obtain",
  "willing to obtain", "willingness to obtain",
]

# ...or within `window_chars` AFTER it, for the "clearance is not required" shape.
negation_after = [
  "not required", "is not required", "isn't required",
  "not needed", "not necessary", "not mandatory",
  "none",   # "Clearance type: None"
]

# How far either side of a match to look for a negation cue. Wider = more jobs
# survive that should have died; narrower = more good jobs get killed silently.
window_chars = 60

[govcon]
# Government contractors and cleared work. On, it kills every employer and
# keyword below, which suits anyone without a security clearance: in a federal
# market most IT postings need one, and the same roles get reposted weekly.
# Off, they reach the queue like any other job. Flip it with `screener govcon on`
# or `screener govcon off`, then run `screener refilter` to apply it to stored jobs.
