  # "Career Listings", with a Leidos DOD contract in the body, so neither the
  # company blocklist nor any clearance phrase above could see it.
  # "SCIF" needs its own entry: the word boundary after "SCI" cannot match it.
  "SCIF",
  "8140",
  "8570",
  "IAT Level",
]

[gate]
# The relevance gate: is this an IT job at all? Runs on the title, before the
# kill rules, so a forklift apprentice is counted as "not IT" rather than
# "wrong location". Three outcomes:
#   deny  -> killed as gate:<pattern>. Deny wins over allow.
#   allow -> goes on to the kill rules.
#   neither ("Technician Apprentice", "Specialist II") -> `ambiguous` decides:
#     classify: one cheap Haiku call asking only "is this an IT support role?",
#               cached by title so the same title never costs twice. Needs
#               OPENROUTER_API_KEY in .env; without it the job is kept.
#     kill:     killed as gate:ambiguous.
#     keep:     goes on to the kill rules.
# Every gate kill is stored with the pattern that matched, and
# `screener killed --since 7d` lists them by title. Check it after a pull: a
# missing allow word means a job you wanted died without a sound.
ambiguous = "classify"

allow = [
  "help desk", "helpdesk", "service desk", "desktop", "deskside",
  "it support", "it specialist", "it technician", "it analyst", "it associate",
  "it assistant", "it coordinator", "it administrator", "it generalist",
  "it operations", "it tech", "it field", "it",
  "information technology", "information systems",
  "technical support", "tech support", "technology support",
  "end user", "user support", "support specialist", "support technician",
  "support analyst", "support engineer", "production support",
  "systems administrator", "system administrator", "sysadmin",
  "systems engineer", "systems analyst", "systems specialist", "systems technician",
  "microsoft 365", "m365", "office 365", "intune", "active directory", "windows",
  "workstation", "endpoint", "computer", "network", "hardware", "infrastructure",
  "tier 1", "tier 2", "tier 3", "tier i", "tier ii", "tier iii", "level 1", "level 2",
