# Keywords, matched like [keywords] kill: negation-aware, so "no clearance
# required" and "ability to obtain a clearance" survive.
kill = [
  "security clearance",
  "active clearance",
  "Secret",
  "Top Secret",
  "TS/SCI",
  "polygraph",
  "Public Trust",
  "suitability determination",
  # Bare "clearance" is the catch-all: "active TS (SCI eligibility) clearance"
  # got past every phrase above. Still negation-aware, so "no clearance
  # required" and "ability to obtain a clearance" survive.
  "clearance",
  "SCI",
  "cleared",
  "CI poly",
  "full scope poly",

